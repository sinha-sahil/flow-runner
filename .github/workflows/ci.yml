name: CI

on:
  push:
    branches-ignore: [release]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # the git hooks are for people; CI runs the same checks as steps
  CARGO_HUSKY_DONT_INSTALL_HOOKS: "1"

jobs:
  commits:
    name: Branch name and commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: scripts/ci/validate_pr.sh "$HEAD_REF" "$BASE_REF"
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}

  scripts:
    name: Scripts and workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck scripts/ci/*.sh .cargo-husky/hooks/*
      - uses: docker://rhysd/actionlint:1.7.12
        with:
          args: -color

  test:
    name: Format, lint, test, docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --all-features
      - run: cargo test
      # the timing tests mean something only in an optimized build
      - run: cargo test --release --all-features --test diagnostics --test document
      - name: Run the examples
        run: for example in decide lifecycle asks editor versions; do cargo run --all-features --example "$example"; done
      - run: cargo doc --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    name: Builds on Rust 1.80
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: dtolnay/rust-toolchain@1.80
      - uses: Swatinem/rust-cache@v2
      # newer dependency releases may need a newer compiler than the MSRV;
      # resolve a lockfile that stays within it before checking
      - run: cargo +stable generate-lockfile
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
      - run: cargo +1.80 check --all-features --lib --bins

  wasm:
    name: Tests on wasm32-wasip1
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-wasip1
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --target wasm32-wasip1 --features json
      # the tests read the example flows by their path in the checkout
      - run: cargo test --target wasm32-wasip1 --features json
        env:
          CARGO_TARGET_WASM32_WASIP1_RUNNER: wasmtime run --dir ${{ github.workspace }}
