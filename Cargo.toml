[package]
name = "flow-runner"
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
description = "An embeddable, deterministic, sans-I/O decision engine — flows are graphs of nodes whose expressions are temple-dsl templates"
license = "MIT"
authors = ["Sahil Sinha <sahilsinha.dar@gmail.com>"]
repository = "https://github.com/sinha-sahil/flow-runner"
documentation = "https://docs.rs/flow-runner"
readme = "README.md"
keywords = ["workflow", "rules-engine", "state-machine", "sans-io", "template"]
categories = ["template-engine", "parser-implementations"]
exclude = [".cargo-husky/", ".github/", "scripts/"]

[dependencies]
temple-dsl = "1.0"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
ciborium = "0.2.2"
sha2 = "0.10"
smol_str = "0.2"
indexmap = "2"
serde_json = { version = "1", optional = true }
serde_yaml_ng = { version = "0.10", optional = true }
rust_decimal = { version = "1", optional = true }

[features]
# Conversions to and from serde_json. Optional because temple's json feature
# turns on serde_json's arbitrary_precision and preserve_order for the whole build.
json = ["dep:serde_json", "temple-dsl/json"]
# The `flow` command-line tool: check, run and test flow files, and print
# their graph or hash.
cli = ["json", "dep:serde_yaml_ng", "dep:rust_decimal"]

[[bin]]
name = "flow"
path = "src/bin/flow/main.rs"
required-features = ["cli"]

[dev-dependencies]
# Slim features so the tests also build for wasm32-wasip1.
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
proptest = { version = "1", default-features = false, features = ["std", "bit-set"] }
serde_json = "1"
# Copies .cargo-husky/hooks into .git/hooks on the first `cargo test`.
cargo-husky = { version = "1", default-features = false, features = ["user-hooks"] }

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[[bench]]
name = "flow_bench"
harness = false
required-features = ["json"]

[[example]]
name = "lifecycle"
required-features = ["json"]

[[example]]
name = "asks"
required-features = ["json"]

[[example]]
name = "editor"
required-features = ["json"]

[[example]]
name = "throughput"
required-features = ["json"]
